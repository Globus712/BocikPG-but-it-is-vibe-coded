server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Uncomment to add source plugins, e.g. Spotify, Apple Music, etc.
    # - dependency: "dev.lavalink.youtube:youtube-plugin:1.11.4"
    #   snapshot: false
  server:
    password: "youshallnotpass"   # keep in sync with LAVALINK_PASSWORD in .env
    sources:
      youtube: true
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: true
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  level:
    root: INFO
    lavalink: INFO
